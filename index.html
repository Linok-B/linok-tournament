<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linok's Local Tournament Manager</title>
    <link rel="icon" type="image/svg+xml" href="./LB_tournament_favicon.svg">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- ANTI-FLASH SCRIPT -->
    <script>
        try {
            let ui = null;
            const uiRaw = localStorage.getItem('tournament_ui');
            if (uiRaw) {
                ui = JSON.parse(uiRaw);
            } else {
                const saved = localStorage.getItem('tournament_state');
                if (saved) ui = JSON.parse(saved).settings?.ui;
            }

            if (ui) {
                if (ui.layout === 'classic') document.body.classList.add('layout-classic');
                if (ui.theme === 'arcade') document.body.classList.add('theme-arcade');
                if (ui.theme === 'custom' && ui.customColors) {
                    const r = document.documentElement.style;
                    r.setProperty('--bg-dark', ui.customColors.bgDark);
                    r.setProperty('--bg-panel', ui.customColors.bgPanel);
                    r.setProperty('--bg-bracket', ui.customColors.bgBracket);
                    r.setProperty('--accent', ui.customColors.accent);
                    r.setProperty('--success', ui.customColors.success);
                    r.setProperty('--danger', ui.customColors.danger);
                    r.setProperty('--text-main', ui.customColors.textMain || '#ffffff');
                    r.setProperty('--text-muted', ui.customColors.textMuted || '#a6adc8');
                    const hex = ui.customColors.bgDark || '#1e1e2e';
                    const rVal = parseInt(hex.slice(1, 3), 16) || 0;
                    const gVal = parseInt(hex.slice(3, 5), 16) || 0;
                    const bVal = parseInt(hex.slice(5, 7), 16) || 0;
                    const isLight = ((rVal * 299 + gVal * 587 + bVal * 114) / 1000) >= 128;
                    r.setProperty('color-scheme', isLight ? 'light' : 'dark');
                }
            }
        } catch(e) {}
    </script>
    <div class="app-container">
        <!-- HOST CONTROLS -->
        <aside class="controls-panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin: 0;">Host Controls</h2>
                <!-- Settings Gear Button -->
                <button id="btn-open-settings" data-icon="gear" data-size="24" title="Tournament Settings" style="background: transparent; border: none; cursor: pointer; color: var(--accent); display:flex; align-items:center;"></button>
            </div>

            <!-- Add Player Group -->
            <div class="control-group">
                <h3>Add Player</h3>
                <textarea id="player-name" placeholder="Player/Team Name (One per line for bulk add)" style="height: 60px; resize: vertical; box-sizing: border-box; background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border-main); padding: 5px; font-family: inherit; font-size: 14px;"></textarea>
                <input type="number" id="player-elo" placeholder="Starting ELO (e.g. 1200)" value="1200">
                <button id="btn-add-player">Add to Tournament</button>
                <button id="btn-clear-players" style="background-color: var(--danger); color: var(--bg-dark); font-weight: bold; margin-top: 5px;">Clear All Players</button>
            </div>

            <!-- Blueprint Builder -->
            <div class="control-group" id="setup-blueprint-group">
                <h3>Tournament Stages</h3>
                
                <!-- JavaScript-filled div-->
                <div id="blueprint-list" style="display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px;"></div>
                
                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 4px;">
                    <label style="font-size: 11px; color: var(--text-muted);">Format</label>
                    <select id="blueprint-type" style="width: 100%; margin-bottom: 5px; padding: 5px; background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border-main);">
                        <option value="single_elimination">Single Elimination</option>
                        <option value="double_elimination">Double Elimination</option>
                        <option value="round_robin">Round Robin</option>
                        <option value="swiss">Swiss System</option>
                        <option value="dpw_swiss">DPW Swiss</option>
                        
                        
                    </select>
                    
                    <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                        <div style="flex: 1;" title="Max rounds to play (for Swiss/Round Robin)">
                            <label style="font-size: 11px; color: var(--text-muted);">Rounds (Opt)</label>
                            <input type="number" id="blueprint-rounds" placeholder="All" style="width: 100%; box-sizing: border-box; padding: 5px;">
                        </div>
                        <div style="flex: 1;" title="Only advance top N players from the Leaderboard">
                            <label style="font-size: 11px; color: var(--text-muted);">Top Cut (Opt)</label>
                            <input type="number" id="blueprint-cut" placeholder="All" style="width: 100%; box-sizing: border-box; padding: 5px;">
                        </div>
                    </div>
                    <label style="font-size: 11px; color: var(--text-muted);">Tiebreaker Profile</label>
                    <button id="btn-open-tb-builder" style="width: 100%; margin-bottom: 10px; padding: 8px; background: var(--border-main); color: var(--text-main); border: none; border-radius: 4px; cursor: pointer; font-weight: bold; display:flex; justify-content:center; align-items:center; gap:8px;"><span data-icon="scale" data-size="16"></span> Configure Tiebreakers</button>
                    <button id="btn-add-stage" style="width: 100%; background: var(--accent); color: var(--bg-dark); font-weight: bold;">+ Add Stage</button>
                </div>
            </div>

            <!-- Format Start Group -->
            <div class="control-group">
                <h3>Tournament Controls</h3>
                <button id="btn-start-elim">Start Tournament</button>
                <button id="btn-clear-data" class="danger">Restart Tournament</button>
            </div>

            <!-- Export / Import Group -->
            <div class="control-group">
                <h3>Data Management</h3>
                <button id="btn-open-library" style="background-color: var(--border-main); color: var(--text-main); display:flex; justify-content:center; align-items:center; gap:8px;"><span data-icon="archive"></span> Library</button>
                <button id="btn-export-data" style="background-color: var(--success); color: var(--text-on-accent); display:flex; justify-content:center; align-items:center; gap:8px;"><span data-icon="save"></span> Export to File</button>
                <input type="file" id="file-import" accept=".json" style="display: none;">
                <button id="btn-import-data" style="background-color: var(--warning); color: var(--text-on-accent); display:flex; justify-content:center; align-items:center; gap:8px;"><span data-icon="folder"></span> Import from File</button>
            </div>
            
            <!-- Privacy and Source Button -->
            <div style="margin-top: auto; padding: 20px 10px 0 10px; display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box;">
                <button id="btn-privacy" style="background: transparent; color: var(--text-muted); border: none; cursor: pointer; font-size: 11px; text-decoration: underline; padding: 0;">Privacy Notice</button>
                <button id="btn-source-license" style="background: transparent; color: var(--text-muted); border: none; cursor: pointer; font-size: 11px; text-decoration: underline; padding: 0;">Source & License</button>
            </div>
        </aside>

        <!-- TOURNAMENT DISPLAY -->
        <main class="display-panel" style="position: relative;">
            
            <!-- HAMBURGER BUTTON (Toggles Sidebar) -->
            <button id="btn-hamburger" title="Toggle Sidebar" style="background: transparent; border: none; font-size: 24px; cursor: pointer; color: var(--text-main); position: absolute; top: 15px; left: 15px; z-index: 50;">☰</button>
            
            <div id="tournament-header" style="padding: 10px 20px 10px 60px;">
                <h1 id="main-tournament-title" style="margin: 0;">Tournament State</h1>
            </div>
            
            <div id="player-list-container" style="padding: 0 20px;"></div>
            <div id="standings-container" style="padding: 0 20px;"></div> 
        </main>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
